<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
</head>
<body>

    <h1>{{ 'Edit Customer' if customer else 'Add New Customer' }}</h1>

    <form method="POST">

        <label>Customer Name:</label>
        <input type="text" name="name"
               value="{{ customer.name if customer else '' }}" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email"
               value="{{ customer.email if customer and customer.email else '' }}">
        <br><br>

        <label>Mobile:</label>
        <input type="text" name="mobile"
               value="{{ customer.mobile if customer and customer.mobile else '' }}">
        <br><br>

        <label>City:</label>
        <input type="text" name="city"
               value="{{ customer.city if customer and customer.city else '' }}">
        <br><br>

        <button type="submit">
            {{ 'Update Customer' if customer else 'Save Customer' }}
        </button>

    </form>

    <br>

    <a href="{{ url_for('customers.customer_list') }}">Back to Customer List</a>

</body>
</html>
